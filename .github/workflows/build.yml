name: Build geomaptools

# Branch pushes and PRs build both jars as workflow artifacts.
# Each Minecraft version gets its own GitHub Release, triggered by a tag of the
# form v<version>-mc<minecraft>, e.g. v4.37-mc1.21.11 or v4.37-mc26.3.
# Such a tag builds and publishes only the jar for that Minecraft version.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25+ is required to read the 26.3 profile's spigot-api classfiles
          # at compile time; our own output still targets release 21 (see
          # pom.xml) so both jars run on an older server JVM just fine.
          java-version: '25'
          cache: maven

      - name: Select Minecraft versions to build
        id: select
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[^-]+-mc(.+)$ ]]; then
            echo "versions=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "mc=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "versions=1.21.11 26.3" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          mkdir -p dist
          for mc in ${{ steps.select.outputs.versions }}; do
            case "$mc" in
              1.21.11) profile="" ;;
              26.3)    profile="-P mc-26.3" ;;
              *) echo "Unknown Minecraft version: $mc"; exit 1 ;;
            esac
            mvn -B clean package $profile
            cp target/geomaptools-*-mc$mc.jar dist/
          done

      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: geomaptools
          path: dist/*.jar

      - name: Publish GitHub Release
        if: steps.select.outputs.mc != ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (Minecraft ${{ steps.select.outputs.mc }})
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
